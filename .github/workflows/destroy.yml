name: Destroy

# Tear an environment down to stop paying for it. Type the environment name to confirm.
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, contoso]
      confirm:
        description: "Type the environment name again to confirm"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    if: inputs.confirm == inputs.environment
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${{ inputs.environment }}.tfstate"
      - run: terraform destroy -auto-approve -input=false -var-file="environments/${{ inputs.environment }}.tfvars"
